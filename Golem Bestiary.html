<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golem Bestiary — Golem Rush</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--cyan:#19f0ff;--mag:#ff2d95;--purple:#c24bff;--amber:#ffd166;--ink:#06070e;}
  *{box-sizing:border-box;}
  body{margin:0;background:
    radial-gradient(circle at 50% 0%,rgba(194,75,255,.10),transparent 55%),
    linear-gradient(rgba(155,92,255,.05) 1px,transparent 1px) 0 0/100% 46px,
    linear-gradient(90deg,rgba(25,240,255,.05) 1px,transparent 1px) 0 0/46px 100%,
    var(--ink);
    color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;}
  header{text-align:center;padding:46px 20px 14px;}
  .kicker{font:700 12px 'Rajdhani';letter-spacing:.6em;color:var(--purple);text-transform:uppercase;opacity:.85;}
  h1{font:900 clamp(34px,6vw,68px) 'Orbitron';margin:8px 0 4px;letter-spacing:-.01em;
    background:linear-gradient(180deg,#fff,#c8a9ff 60%,var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(194,75,255,.3));}
  .sub{color:rgba(255,255,255,.5);font-size:15px;letter-spacing:.15em;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px;
    max-width:1280px;margin:30px auto 60px;padding:0 22px;}
  .card{background:linear-gradient(180deg,rgba(16,14,26,.92),rgba(10,9,18,.96));
    border:1px solid rgba(194,75,255,.22);border-radius:4px;overflow:hidden;
    clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
    box-shadow:0 18px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;}
  .card.boss{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;}
  .stage{position:relative;width:100%;aspect-ratio:1/1;background:
    radial-gradient(ellipse at 50% 38%,rgba(194,75,255,.16),transparent 62%),
    radial-gradient(ellipse at 50% 100%,rgba(25,240,255,.10),transparent 60%),#0a0a14;}
  .card.boss .stage{flex:1 1 360px;aspect-ratio:auto;min-height:420px;}
  .stage canvas{display:block;width:100%;height:100%;}
  .tag{position:absolute;top:12px;left:12px;font:700 11px 'Rajdhani';letter-spacing:.22em;white-space:nowrap;
    padding:4px 10px;border:1px solid;border-radius:3px;background:rgba(0,0,0,.4);text-transform:uppercase;}
  .meta{padding:18px 20px 22px;}
  .card.boss .meta{flex:1 1 320px;display:flex;flex-direction:column;justify-content:center;}
  .name{font:900 26px 'Orbitron';letter-spacing:.02em;margin-bottom:2px;}
  .role{font:700 12px 'Rajdhani';letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:12px;}
  .desc{font-size:14.5px;line-height:1.5;color:rgba(255,255,255,.72);margin:0 0 14px;}
  .bars{display:flex;flex-direction:column;gap:7px;}
  .bar{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:10px;}
  .bar span{font:700 10px 'Rajdhani';letter-spacing:.16em;color:rgba(255,255,255,.45);}
  .track{height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;}
  .fill{height:100%;border-radius:4px;}
  footer{text-align:center;color:rgba(255,255,255,.35);font-size:13px;letter-spacing:.1em;padding:0 20px 50px;}
  footer a{color:var(--cyan);text-decoration:none;}
</style>
</head>
<body>
<header>
  <div class="kicker">Golem Rush · Fantasy Realm — Threat Index</div>
  <h1>GOLEM BESTIARY</h1>
  <div class="sub">Five faceted stone horrors stalking the crossing</div>
</header>

<div class="grid" id="grid"></div>

<footer>Drag-free turntable previews · models pulled straight from the game · <a href="Golem Rush.html">▶ Back to the game</a></footer>

<script src="js/enemies.js"></script>
<script>
const GOLEMS = [
  { type: 'grunt',   name: 'GRUNT',   role: 'Basic Chaser', col: '#c24bff',
    desc: 'The footsoldier of the swarm. A hunched boulder that knuckle-walks straight at you and swings stone fists. Numerous, predictable, deadly in a pack.',
    stats: { HP: 0.28, SPD: 0.5, DMG: 0.35 } },
  { type: 'runner',  name: 'RUNNER',  role: 'Swarm Rusher', col: '#ff3bd0',
    desc: 'A compact four-legged boulder that scuttles fast and low. Fragile alone, but they flood in to overwhelm — drop them before they close.',
    stats: { HP: 0.14, SPD: 1.0, DMG: 0.2 } },
  { type: 'tank',    name: 'TANK',    role: 'Armored Bruiser', col: '#a24bff',
    desc: 'A walking mountain. Enormous health and a crushing melee hit, but slow. Keep moving and peel its rock layers with sustained fire.',
    stats: { HP: 1.0, SPD: 0.25, DMG: 0.85 } },
  { type: 'shooter', name: 'SHADE-CASTER', role: 'Ranged Attacker', col: '#8a5bff',
    desc: 'Cups a glowing core between its hands and hurls bolts of violet energy from range. It keeps its distance — close the gap or break line of sight.',
    stats: { HP: 0.25, SPD: 0.34, DMG: 0.55 } },
  { type: 'dragon',  name: 'ROK WYRM', role: 'Flying Fire-Breather', col: '#ff7a2e',
    desc: 'A winged stone wyrm that circles overhead and rains molten fire bolts. It never lands — track it across the sky and burn it down before it scorches you.',
    stats: { HP: 0.85, SPD: 0.7, DMG: 0.6 } },
  { type: 'boss',    name: 'APEX HORROR', role: 'Wave Boss · every 5th wave', col: '#ff2d95',
    desc: 'A colossal four-eyed golem crowned in moss. Massive health, devastating melee, and a fan of energy bolts. It arrives with an escort — survive the onslaught.',
    stats: { HP: 1.0, SPD: 0.3, DMG: 1.0 } },
  { type: 'spider',  name: 'SUPER APEX SPIDER', role: 'Mega Boss · every 10th wave', col: '#8bff36',
    desc: 'A titanic eight-legged stone arachnid with a cluster of glowing venom eyes and dripping fangs. It scuttles in fast on long jointed legs and bites with crushing force — the deadliest thing in the city.',
    stats: { HP: 1.0, SPD: 0.45, DMG: 1.0 } },
  { type: 'sapling', name: 'SAPLING GOBLIN', role: 'Twig Imp · Fast Swarmer', col: '#9be84a',
    desc: 'A tiny twig-and-leaf imp that sprints in on spindly legs. Barely any health, but they come in packs and nip at your heels — stomp them before they swarm.',
    stats: { HP: 0.16, SPD: 0.85, DMG: 0.22 } },
  { type: 'bramble', name: 'BRAMBLE GOBLIN', role: 'Thorny Hunter', col: '#c6f23a',
    desc: 'A hunched, thorn-backed goblin with clawed branch arms and a glowing jagged maw. Tougher and meaner than a sapling, it closes in and rakes you with twig talons.',
    stats: { HP: 0.42, SPD: 0.46, DMG: 0.45 } },
  { type: 'treant',  name: 'ELDER TREANT GOBLIN', role: 'Mossy Seed-Hurler', col: '#6fd83a',
    desc: 'A lumbering tree-beast crowned with a leafy canopy and a hollow glowing face. It keeps its distance and lobs glowing thorn-seeds, soaking enormous punishment as it advances.',
    stats: { HP: 0.7, SPD: 0.22, DMG: 0.5 } }
];

function makeCard(def) {
  const card = document.createElement('div');
  card.className = 'card' + (def.type === 'boss' || def.type === 'spider' ? ' boss' : '');
  const stage = document.createElement('div'); stage.className = 'stage';
  const tag = document.createElement('div'); tag.className = 'tag';
  tag.textContent = def.role.split('·')[0].trim();
  tag.style.color = def.col; tag.style.borderColor = def.col;
  stage.appendChild(tag);

  const meta = document.createElement('div'); meta.className = 'meta';
  const bars = Object.entries(def.stats).map(([k, v]) =>
    `<div class="bar"><span>${k}</span><div class="track"><div class="fill" style="width:${Math.round(v * 100)}%;background:linear-gradient(90deg,${def.col},#fff8)"></div></div></div>`
  ).join('');
  meta.innerHTML = `<div class="name" style="color:${def.col}">${def.name}</div>
    <div class="role">${def.role}</div>
    <p class="desc">${def.desc}</p>
    <div class="bars">${bars}</div>`;

  card.appendChild(stage); card.appendChild(meta);
  document.getElementById('grid').appendChild(card);
  return stage;
}

function setupScene(stage, def) {
  const w = stage.clientWidth, h = stage.clientHeight;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 100);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  stage.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x44486a, 0.7));
  const key = new THREE.DirectionalLight(0xbfd0ff, 1.1); key.position.set(3, 6, 5); scene.add(key);
  const rim = new THREE.PointLight(new THREE.Color(def.col), 3.4, 30, 2); rim.position.set(-3, 2.5, -3); scene.add(rim);
  const fill = new THREE.PointLight(0x19f0ff, 1.6, 30, 2); fill.position.set(4, 1, 3); scene.add(fill);

  const disc = new THREE.Mesh(
    new THREE.CylinderGeometry(2.6, 2.6, 0.12, 48),
    new THREE.MeshStandardMaterial({ color: 0x14141f, roughness: 0.8, metalness: 0.2 })
  );
  scene.add(disc);

  const golem = EnemyFactory.build(def.type);
  const cfg = EnemyFactory.TYPES[def.type];
  golem.scale.setScalar(cfg.scale);

  golem.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(golem);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const footY = box.min.y;
  // center the model horizontally at origin, feet on the disc
  golem.position.x -= center.x; golem.position.z -= center.z; golem.position.y -= footY;
  disc.position.y = 0;
  const pivot = new THREE.Group(); scene.add(pivot); pivot.add(golem);

  const radius = Math.max(size.x, size.z, size.y) * 0.6;
  const dist = radius / Math.tan((camera.fov * Math.PI / 180) / 2) + radius;
  const midY = size.y * 0.52;
  camera.position.set(0, midY + size.y * 0.12, dist * 1.12);
  camera.lookAt(0, midY, 0);

  let t = Math.random() * 6;
  (function animate() {
    requestAnimationFrame(animate);
    t += 0.008;
    pivot.rotation.y += 0.006;
    pivot.position.y = Math.sin(t * 1.5) * 0.05;
    const pulse = 2.2 + Math.sin(t * 2.4) * 0.8;
    (golem.userData.cores || []).forEach(m => m.emissiveIntensity = pulse);
    if (golem.userData.parts && golem.userData.parts.orb)
      golem.userData.parts.orb.scale.setScalar(1 + Math.sin(t * 3) * 0.14);
    renderer.render(scene, camera);
  })();

  addEventListener('resize', () => {
    const nw = stage.clientWidth, nh = stage.clientHeight;
    camera.aspect = nw / nh; camera.updateProjectionMatrix(); renderer.setSize(nw, nh);
  });
}

window.addEventListener('load', () => {
  GOLEMS.forEach(def => {
    const stage = makeCard(def);
    setTimeout(() => setupScene(stage, def), 0);
  });
});
</script>
</body>
</html>
